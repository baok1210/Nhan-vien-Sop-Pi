{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:600px;margin:20px auto">
  <h3 style="font-size:16px">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" style="vertical-align:text-bottom;margin-right:6px"><path d="M8 1v14M1 8h14"/></svg>
    Thêm cửa hàng mới
  </h3>
  <form method="POST" action="/store/new" onsubmit="return confirm('Tạo cửa hàng mới?')">
    <div class="form-group">
      <label class="form-label">Tên cửa hàng *</label>
      <input class="form-input" type="text" name="name" required placeholder="VD: Phụ kiện bếp">
    </div>
    <div class="form-group">
      <label class="form-label">ID (để trống tự động tạo)</label>
      <input class="form-input" type="text" name="store_id" placeholder="VD: phu-kien-bep">
    </div>
    <div class="form-group">
      <label class="form-label">Từ khóa tiếng Việt</label>
      <input class="form-input" type="text" name="kw_vn" placeholder="phụ kiện bếp, đồ dùng nhà bếp">
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Từ khóa tiếng Trung</label>
        <input class="form-input" type="text" name="kw_cn" placeholder="厨房配件, 厨房工具">
      </div>
      <div class="form-group">
        <label class="form-label">Từ khóa tiếng Anh</label>
        <input class="form-input" type="text" name="kw_en" placeholder="kitchen accessories">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">Hệ số giá</label>
        <input class="form-input" type="number" name="price_multiplier" step="0.1" value="2.5">
      </div>
      <div class="form-group">
        <label class="form-label">Giá CNY tối đa</label>
        <input class="form-input" type="number" name="max_price_cny" value="140">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Chữ watermark (tùy chọn)</label>
      <input class="form-input" type="text" name="wm_text" placeholder="@shopee_cua_hang">
    </div>
    <div class="flex" style="gap:8px;margin-top:8px">
      <button type="submit" class="btn btn-success">Tạo cửa hàng</button>
      <a href="/" class="btn btn-ghost">Hủy</a>
    </div>
  </form>
</div>
{% endblock %}
