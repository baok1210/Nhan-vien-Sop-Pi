{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>Thêm cửa hàng mới</h3>
  <form method="POST" action="/store/new" onsubmit="return confirm('Tạo cửa hàng mới?')">
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-weight:500">Tên cửa hàng *</label>
      <input type="text" name="name" required style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px" placeholder="VD: Phụ kiện bếp">
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-weight:500">ID cửa hàng (để trống để tự động tạo)</label>
      <input type="text" name="store_id" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px" placeholder="VD: phu-kien-bep">
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-weight:500">Từ khóa tiếng Việt</label>
      <input type="text" name="kw_vn" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px" placeholder="phụ kiện bếp, đồ dùng nhà bếp">
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-weight:500">Từ khóa tiếng Trung</label>
      <input type="text" name="kw_cn" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px" placeholder="厨房配件, 厨房工具">
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-weight:500">Từ khóa tiếng Anh</label>
      <input type="text" name="kw_en" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px" placeholder="kitchen accessories">
    </div>
    <div class="grid-2">
      <div style="margin-bottom:12px">
        <label style="display:block;margin-bottom:4px;font-weight:500">Hệ số giá (price_multiplier)</label>
        <input type="number" name="price_multiplier" step="0.1" value="2.5" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px">
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;margin-bottom:4px;font-weight:500">Giá CNY tối đa</label>
        <input type="number" name="max_price_cny" value="140" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px">
      </div>
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:4px;font-weight:500">Chữ watermark (tùy chọn)</label>
      <input type="text" name="wm_text" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px" placeholder="VD: @shopee_cua_hang">
    </div>
    <button type="submit" class="btn btn-success">Tạo cửa hàng</button>
    <a href="/" class="btn btn-sm" style="margin-left:8px">Hủy</a>
  </form>
</div>
{% endblock %}
