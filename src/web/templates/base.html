<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>China Dropship to Shopee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a1a2e;color:#fff;padding:20px 0;flex-shrink:0}
.sidebar h2{padding:0 20px 20px;font-size:16px;border-bottom:1px solid #16213e}
.sidebar a{display:block;padding:12px 20px;color:#a0a0b8;text-decoration:none;font-size:14px;transition:.2s}
.sidebar a:hover,.sidebar a.active{color:#fff;background:#16213e}
.main{flex:1;padding:30px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:14px;color:#666;margin-bottom:8px}
.card .value{font-size:28px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
pre{background:#f8f9fa;padding:15px;border-radius:8px;font-size:13px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
textarea{width:100%;min-height:400px;font-family:monospace;font-size:13px;padding:15px;border:1px solid #ddd;border-radius:8px;resize:vertical}
.btn{display:inline-block;padding:10px 24px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-weight:600;text-decoration:none}
.btn-primary{background:#4361ee;color:#fff}
.btn-primary:hover{background:#3a56d4}
.btn-primary:disabled{background:#a0a0b8;cursor:not-allowed}
.btn-success{background:#2ec4b6;color:#fff}
.btn-success:hover{background:#28a99d}
.btn-sm{padding:6px 14px;font-size:12px}
.warning{background:#fff3cd;border:1px solid #ffc107;padding:12px 16px;border-radius:8px;margin-bottom:15px;font-size:13px}
.warning strong{color:#856404}
.log-box{background:#1a1a2e;color:#0f0;padding:15px;border-radius:8px;font-family:monospace;font-size:12px;max-height:300px;overflow-y:auto;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eee}
th{color:#666;font-weight:600;font-size:12px;text-transform:uppercase}
tr:hover{background:#f8f9fa}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-blue{background:#e0e7ff;color:#4361ee}
.badge-green{background:#d1fae5;color:#059669}
.ok-msg{color:#059669;font-weight:600;margin-bottom:10px}
.err-msg{color:#dc2626;font-weight:600;margin-bottom:10px}
img{max-width:60px;max-height:60px;border-radius:4px;object-fit:cover}
.flex{display:flex;align-items:center;gap:10px}
.mt-10{margin-top:10px}
.mb-10{margin-bottom:10px}
</style>
</head>
<body>
<div class="sidebar">
  <h2>&#9733; China Dropship</h2>
  <a href="/" class="{% if current == '/' %}active{% endif %}">&#9632; Dashboard</a>
  <a href="/crawl" class="{% if current == '/crawl' %}active{% endif %}">&#9654; Crawl</a>
  <a href="/products" class="{% if current == '/products' %}active{% endif %}">&#9776; San pham</a>
  <a href="/config" class="{% if current == '/config' %}active{% endif %}">&#9881; Cau hinh</a>
</div>
<div class="main">
  {% block content %}{% endblock %}
</div>
</body>
</html>
